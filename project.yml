# XcodeGen の設定。`make bootstrap` で Todo.xcodeproj を生成する。
name: Todo

options:
  bundleIdPrefix: com.taiyoyamada
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 構成名を Debug / Release で始めているのは、Xcode がローカルパッケージを
# デバッグ用とリリース用のどちらでビルドするかを構成の種類から決めるため。
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Configs/Dev.xcconfig
  Release-Dev: Configs/Dev.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig

packages:
  TodoKit:
    path: Packages/TodoKit
  Domain:
    path: Packages/Domain

targets:
  Todo:
    type: application
    platform: iOS
    sources:
      - path: App
      # アプリを開く App Intent。開かれる側にも定義が要るので、ウィジェットと同じファイルを入れる。
      - path: Extensions/Shared
    dependencies:
      - package: TodoKit
        product: AppFeature
      - package: TodoKit
        product: SharedCore
      - target: TodoWidgets
      - target: TodoShieldMonitor
      - target: TodoShieldConfiguration
    entitlements:
      path: App/Todo.entitlements
      properties:
        # スクリーンタイム API を使うための権限。有料の Apple Developer Program が必要。
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        AppEnvironment: $(APP_ENVIRONMENT)
        AppGroupIdentifier: $(APP_GROUP_ID)
        AppURLScheme: $(APP_URL_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - $(APP_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Todo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # 開発用の構成でだけ DEV を定義する。見本データの切り替えなど、本番に入れない機能の目印。
        Debug-Dev:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV
        Release-Dev:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV

  # ウィジェットと Live Activity。中身は TodoKit の WidgetUI にあり、ここは入口だけ。
  TodoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
      - path: Extensions/Shared
    dependencies:
      - package: TodoKit
        product: WidgetUI
      - package: TodoKit
        product: SharedCore
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ja]
        AppGroupIdentifier: $(APP_GROUP_ID)
        AppURLScheme: $(APP_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        SKIP_INSTALL: YES

  # 予約した時刻に起こされて、ロックを掛け直す拡張機能(実機で未検証)。
  # 使えるメモリが小さいので、TCA などは入れず SharedCore だけに依存させる。
  TodoShieldMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldMonitor
    dependencies:
      - package: TodoKit
        product: SharedCore
    entitlements:
      path: Extensions/ShieldMonitor/ShieldMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Extensions/ShieldMonitor/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shield-monitor
        SKIP_INSTALL: YES

  # ロックされたアプリを開いたときに出る画面の、文言と色を決める拡張機能(実機で未検証)。
  TodoShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
    dependencies:
      - package: TodoKit
        product: SharedCore
    entitlements:
      path: Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ja]
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).shield-configuration
        SKIP_INSTALL: YES

  # 画面を実際に操作して確かめるテスト。見本データ(-sampleData)で起動するので、開発用の構成でだけ動く。
  TodoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Todo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Todo

schemes:
  Todo-Dev:
    build:
      targets:
        Todo: all
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - package: TodoKit/DatabaseClientTests
        - package: TodoKit/AppFeatureTests
        - name: TodoUITests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Todo-Prod:
    build:
      targets:
        Todo: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
