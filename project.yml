# XcodeGen の設定。`make bootstrap` で Todo.xcodeproj を生成する。
name: Todo

options:
  bundleIdPrefix: com.taiyoyamada
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 構成名を Debug / Release で始めているのは、Xcode がローカルパッケージを
# デバッグ用とリリース用のどちらでビルドするかを構成の種類から決めるため。
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Configs/Dev.xcconfig
  Release-Dev: Configs/Dev.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig

packages:
  TodoKit:
    path: Packages/TodoKit
  Domain:
    path: Packages/Domain

targets:
  Todo:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TodoKit
        product: AppFeature
      - target: TodoWidgets
    entitlements:
      path: App/Todo.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        AppEnvironment: $(APP_ENVIRONMENT)
        AppGroupIdentifier: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Todo
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # 開発用の構成でだけ DEV を定義する。見本データの切り替えなど、本番に入れない機能の目印。
        Debug-Dev:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV
        Release-Dev:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV

  # ウィジェットと Live Activity。中身は TodoKit の WidgetUI にあり、ここは入口だけ。
  TodoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
    dependencies:
      - package: TodoKit
        product: WidgetUI
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ja]
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        SKIP_INSTALL: YES

  # 画面を実際に操作して確かめるテスト。見本データ(-sampleData)で起動するので、開発用の構成でだけ動く。
  TodoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Todo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Todo

schemes:
  Todo-Dev:
    build:
      targets:
        Todo: all
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets:
        - package: TodoKit/DatabaseClientTests
        - package: TodoKit/AppFeatureTests
        - name: TodoUITests
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Todo-Prod:
    build:
      targets:
        Todo: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
